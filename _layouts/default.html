<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:400,700&display=swap">
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
    <style>
      .page-header .project-name a {
        color: inherit;
        text-decoration: none;
      }
      .page-header .project-name a:hover {
        text-decoration: underline;
        opacity: 0.85;
      }
      .print-buttons {
        margin-top: 3rem;
        padding-top: 1.5rem;
        border-top: 1px solid #dce6f0;
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .print-btn {
        display: inline-block;
        padding: 0.6rem 1.3rem;
        background: #159957;
        color: #fff;
        border-radius: 0.3rem;
        font-size: 0.95rem;
        text-decoration: none;
        cursor: pointer;
        border: none;
      }
      .print-btn:hover { background: #0f7a3e; color: #fff; text-decoration: none; }
      .print-btn.secondary { background: #555; }
      .print-btn.secondary:hover { background: #333; }

      @media print {
        @page { size: A4; margin: 2cm 2.2cm; }

        .page-header, .print-buttons, .site-footer { display: none !important; }
        body { font-size: 11pt; line-height: 1.55; }

        /* Überschrift nie allein am Seitenende */
        h1, h2, h3, h4 {
          break-after: avoid;
          page-break-after: avoid;
        }
        /* Ersten Absatz/Liste nach Überschrift mit ihr zusammenhalten */
        h2 + p, h3 + p, h4 + p,
        h2 + ul, h3 + ul, h4 + ul,
        h2 + ol, h3 + ol, h4 + ol,
        h2 + blockquote, h3 + blockquote {
          break-before: avoid;
          page-break-before: avoid;
        }
        /* Kästen, Tabellen, Code-Blöcke nicht zerreissen */
        blockquote, pre, table, figure {
          break-inside: avoid;
          page-break-inside: avoid;
        }
        /* Horizontale Trennlinien: neuen Abschnitt nicht am Seitenende beginnen */
        hr + h2, hr + h3 {
          break-before: avoid;
          page-break-before: avoid;
        }
        p { orphans: 3; widows: 3; }
        a[href]::after { content: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <header class="page-header" role="banner">
        <h1 class="project-name">
          <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
        </h1>
        <h2 class="project-tagline">{{ site.description }}</h2>
      </header>

      <main id="content" class="main-content" role="main">
        {{ content }}

        <div class="print-buttons">
          <button class="print-btn" onclick="window.print()">🖨 Seite ausdrucken</button>
          <a class="print-btn secondary" href="{{ '/pdfs/Lernratgeber_komplett.pdf' | relative_url }}" target="_blank">📄 Alles ausdrucken (PDF)</a>
        </div>

        <footer class="site-footer">
          <span class="site-footer-credits">
            <a href="https://github.com/metrodorian/Lernratgeber">Auf GitHub ansehen</a>
          </span>
        </footer>
      </main>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  </body>
</html>
